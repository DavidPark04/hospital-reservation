server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:${PORT:18081}}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: 5m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
spring:
  application:
    name: hospital-reservation
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27118/MediPick?replicaSet=hospital-rs}
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt-secret: ${JWT_SECRET}
  social:
    frontend-url: ${APP_FRONTEND_URL:http://127.0.0.1:5174}
    backend-url: ${APP_BACKEND_URL:http://127.0.0.1:18081}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao-client-id: ${KAKAO_CLIENT_ID:}
    kakao-client-secret: ${KAKAO_CLIENT_SECRET:}
  demo-enabled: ${DEMO_ENABLED:true}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6.2-sol}
  hira:
    hospital-key: ${HIRA_HOSPITAL_KEY:}
    detail-key: ${HIRA_DETAIL_KEY:}
  comwel:
    api-key: ${COMWEL_API_KEY:}
logging:
  level:
    org.mongodb.driver: WARN
springdoc:
  swagger-ui:
    path: /swagger-ui.html
