name: Vercel production

on:
  workflow_run:
    workflows: [Application checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.repository == 'DavidPark04/hospital-reservation' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@65.16.0
      - name: Verify current main and deploy checked source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$DEPLOY_SHA" != "$main_sha" ]]; then
            echo "Skipped: a newer commit is already on main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/application-checks.yml/runs?branch=main&event=push&status=success&head_sha=${DEPLOY_SHA}&per_page=1" --jq '.workflow_runs | length')"
          if [[ "$passed" == "0" ]]; then
            echo "Application checks must succeed for this exact main commit before deployment." >&2
            exit 1
          fi
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN secret}"
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID secret}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_PROJECT_ID secret}"
          vercel deploy --prod --yes
          echo "Production deployment completed for ${DEPLOY_SHA}." >> "$GITHUB_STEP_SUMMARY"
