name: Hospital basic catalog sync

on:
  schedule:
    # Separate triggers retain the intended KST weekday across delays and re-runs.
    - cron: '0 15 * * 0' # Monday 00:00 KST
    - cron: '0 15 * * 1' # Tuesday 00:00 KST
    - cron: '0 15 * * 2' # Wednesday 00:00 KST
    - cron: '0 15 * * 3' # Thursday 00:00 KST
    - cron: '0 15 * * 4' # Friday 00:00 KST
    - cron: '0 15 * * 5' # Saturday 00:00 KST
    - cron: '0 15 * * 6' # Sunday 00:00 KST: retry recorded failures once
  workflow_dispatch:
    inputs:
      day:
        description: 'KST weekday group; sunday retries recorded failures only'
        type: choice
        required: true
        default: monday
        options:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday

permissions:
  contents: read
  actions: read

concurrency:
  group: hospital-basic-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh hospital basics
    if: github.repository == 'medipick-dev/hospital-reservation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select scheduled region group
        id: plan
        run: python scripts/hospital-catalog-schedule.py
      - name: Install MongoDB client
        run: npm ci --ignore-scripts
      - name: Collect weekday requests or retry Sunday failures once
        env:
          HIRA_HOSPITAL_KEY: ${{ secrets.HIRA_HOSPITAL_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_DAY: ${{ steps.plan.outputs.day }}
          CATALOG_MODE: ${{ steps.plan.outputs.mode }}
          CATALOG_REGIONS: ${{ steps.plan.outputs.regions }}
        run: python scripts/run-hospital-catalog.py --directory .runtime/hospital-catalog --day "$CATALOG_DAY"
      - name: Preserve request checkpoints for Sunday
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hospital-catalog-checkpoint-${{ github.run_id }}
          path: .runtime/hospital-catalog/checkpoint/**
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Publish collection and retry summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result_path = Path('.runtime/hospital-catalog/result.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('Hospital basic catalog collection and Sunday retry\n\n')
              if not result_path.is_file():
                  output.write('No execution summary was produced. Check the failed or canceled step; completion is not confirmed.\n')
              else:
                  result = json.loads(result_path.read_text(encoding='utf-8'))
                  for field in ('day', 'mode', 'weekStartKst', 'completeRegions', 'deferredRegions', 'requests', 'skipped'):
                      output.write(f'- {field}: {json.dumps(result.get(field), ensure_ascii=False)}\n')
                  batches = result.get('batches', [])
                  output.write(f'- batches: {len(batches) if isinstance(batches, list) else json.dumps(batches, ensure_ascii=False)}\n')
                  if isinstance(batches, list):
                      for batch in batches:
                          fields = ('day', 'claimed', 'completeRegions', 'deferredRegions', 'requests', 'failedRequests', 'skippedRequests', 'appliedRegions')
                          output.write(f"\nBatch: {json.dumps({field: batch.get(field) for field in fields}, ensure_ascii=False)}\n")
                  output.write('\nOnly complete validated regions are applied. Weekday requests have no immediate retries; Sunday failed requests are attempted once.\n')
          PY
