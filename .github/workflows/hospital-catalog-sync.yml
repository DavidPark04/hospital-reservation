name: Hospital basic catalog sync

on:
  schedule:
    # 15:00 UTC is 00:00 Asia/Seoul. GitHub can delay scheduled jobs.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hospital-basic-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh hospital basics
    if: github.repository == 'DavidPark04/hospital-reservation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install MongoDB client
        run: npm ci --ignore-scripts
      - name: Collect and validate complete basic snapshot
        env:
          HIRA_HOSPITAL_KEY: ${{ secrets.HIRA_HOSPITAL_KEY }}
        run: python scripts/collect-hospital-catalog.py --directory .runtime/hospital-catalog --page-size 1000 --timeout 120 --workers 2 --maximum-calls 10000
      - name: Apply changed records and retire missing records
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/sync-hospital-catalog.mjs --directory .runtime/hospital-catalog --apply
      - name: Publish counts
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('.runtime/hospital-catalog/sync-result.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('Hospital basic catalog refreshed. Detailed API caching is unchanged.\n\n')
              for field in ('rows', 'inserted', 'updated', 'reactivated', 'retired', 'unchanged', 'verified'):
                  output.write(f'- {field}: {result[field]}\n')
          PY
