name: Application checks

on:
  push:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test production synchronization
        working-directory: .
        run: node --test scripts/tests/production-sync.test.mjs
      - run: npm test
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27118/?replicaSet=hospital-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Start isolated MongoDB replica set
        shell: bash
        run: |
          docker run --detach --name hospital-test-mongo \
            --publish 127.0.0.1:27118:27118 mongo:8.0.16 \
            --replSet hospital-rs --bind_ip_all --port 27118
          for attempt in $(seq 1 45); do
            if docker exec hospital-test-mongo mongosh --port 27118 --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec hospital-test-mongo mongosh --port 27118 --quiet --eval \
            'rs.initiate({_id:"hospital-rs",members:[{_id:0,host:"localhost:27118"}]})'
          for attempt in $(seq 1 45); do
            if docker exec hospital-test-mongo mongosh --port 27118 --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs hospital-test-mongo
          exit 1
      - name: Run unit and MongoDB integration tests and build
        working-directory: backend
        run: bash ./gradlew --no-daemon test bootJar
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test weekly hospital catalog collection, retry claims and MongoDB updates
        run: |
          npm ci --ignore-scripts
          python3 -m unittest discover -s scripts/tests -p 'test_hospital_catalog*.py'
          node --test scripts/tests/hospital-catalog.test.mjs scripts/tests/hospital-catalog-claim.test.mjs scripts/tests/hospital-collection-rename.test.mjs scripts/tests/backend-runtime.test.mjs
      - name: Require all tests to execute
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('backend/build/test-results/test').glob('TEST-*.xml'))
          if not reports:
              raise SystemExit('No JUnit reports were produced')
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for path in reports:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print(totals)
          if totals['tests'] == 0 or any(totals[key] for key in ('failures', 'errors', 'skipped')):
              raise SystemExit('Tests must execute without failures, errors or skips')
          PY
      - name: Build backend container
        run: docker build --tag hospital-reservation-backend:ci ./backend
      - name: Stop isolated MongoDB
        if: always()
        run: docker rm --force hospital-test-mongo
