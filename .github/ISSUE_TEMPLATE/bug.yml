name: 버그 보고
description: 재현 방법과 기대 결과를 기록합니다.
title: "[버그] "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 브랜치·커밋·환경과 재현 순서를 적습니다. 비밀 키나 개인정보는 제외합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과와 실제 결과
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 확인 자료
      description: 필요한 로그·스크린샷·테스트 결과만 첨부합니다.
